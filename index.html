<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Central local e privada para PDI, liderança, desenvolvimento de equipe, projeto e portfólio profissional." />
  <title>Núcleo — Central de Desenvolvimento</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --surface-3: #eef1f5;
  --text: #172033;
  --muted: #687287;
  --subtle: #8c95a6;
  --line: #e1e5ec;
  --line-strong: #cfd5df;
  --navy: #0b1220;
  --navy-2: #111c31;
  --accent: #1d7a78;
  --accent-2: #155e75;
  --accent-soft: #e1f2f1;
  --gold: #b88736;
  --gold-soft: #f7eddb;
  --success: #21835a;
  --warning: #b56b17;
  --danger: #b44242;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-md: 0 14px 40px rgba(15, 23, 42, .10);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --sidebar-w: 260px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1421;
  --surface: #121c2c;
  --surface-2: #162234;
  --surface-3: #1b293e;
  --text: #edf2f8;
  --muted: #a6b0c0;
  --subtle: #7f8ba0;
  --line: #26354b;
  --line-strong: #34455f;
  --navy: #08101d;
  --navy-2: #111c31;
  --accent: #49aaa5;
  --accent-2: #60a5b8;
  --accent-soft: #173537;
  --gold: #d2a75f;
  --gold-soft: #3a2d1c;
  --success: #5ec493;
  --warning: #e4a14b;
  --danger: #ed7b7b;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .22);
  --shadow-md: 0 16px 44px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, var(--navy), #0d1829 70%, #0a1422);
  color: #e9eef7;
  padding: 22px 16px;
  z-index: 30;
  box-shadow: 8px 0 30px rgba(6, 12, 24, .12);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, #2e9b96, #155e75);
  font-weight: 800; font-size: 21px;
  box-shadow: inset 0 1px rgba(255,255,255,.2), 0 8px 18px rgba(0,0,0,.22);
}
.brand strong { display:block; font-size: 17px; letter-spacing: .01em; }
.brand span { color: #98a8be; font-size: 11px; display:block; margin-top:1px; }
.nav { display:flex; flex-direction:column; gap:4px; overflow:auto; padding-right:2px; }
.nav-item {
  appearance:none; border:0; background:transparent; width:100%;
  display:flex; align-items:center; gap:12px; text-align:left;
  color:#aeb9c9; padding:10px 12px; border-radius:11px;
  cursor:pointer; transition:.18s ease; font-size:14px;
}
.nav-item:hover { background:rgba(255,255,255,.07); color:#fff; }
.nav-item.active { background:rgba(73,170,165,.16); color:#fff; box-shadow: inset 3px 0 #49aaa5; }
.nav-icon { width:22px; text-align:center; font-size:17px; color:#8fa1b8; }
.nav-item.active .nav-icon { color:#71c9c5; }
.sidebar-footer { margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.08); }
.privacy-chip { margin:12px 10px 0; color:#8291a6; font-size:10px; display:flex; gap:7px; align-items:center; }
.privacy-chip span { width:7px;height:7px;border-radius:50%;background:#49aaa5;box-shadow:0 0 0 4px rgba(73,170,165,.12); }

.main-column { margin-left:var(--sidebar-w); min-height:100vh; }
.topbar {
  position:sticky; top:0; z-index:20;
  min-height:84px; padding:15px 28px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  background:color-mix(in srgb, var(--surface) 91%, transparent);
  backdrop-filter: blur(18px);
  border-bottom:1px solid var(--line);
}
.page-heading p, .eyebrow { margin:0; text-transform:uppercase; letter-spacing:.11em; font-size:10px; font-weight:700; color:var(--accent); }
.page-heading h1 { margin:2px 0 0; font-size:23px; line-height:1.2; letter-spacing:-.025em; }
.topbar-actions { display:flex; align-items:center; gap:9px; }
.search-wrap {
  height:40px; min-width:260px; display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:0 11px;
}
.search-wrap input { width:100%; border:0; outline:0; background:transparent; color:var(--text); font-size:13px; }
.search-wrap input::placeholder { color:var(--subtle); }
.icon-button {
  width:40px; height:40px; border:1px solid var(--line); border-radius:11px;
  background:var(--surface); cursor:pointer; display:grid; place-items:center;
  transition:.18s ease; box-shadow:var(--shadow-sm);
}
.icon-button:hover { transform:translateY(-1px); border-color:var(--line-strong); }
.button {
  border:1px solid var(--line); border-radius:11px; background:var(--surface);
  padding:10px 14px; cursor:pointer; font-weight:700; font-size:13px; transition:.18s ease;
}
.button:hover { transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.button-primary { background:var(--accent); color:white; border-color:transparent; }
.button-danger { color:var(--danger); }
.button-ghost { background:transparent; box-shadow:none; }
.button-small { padding:7px 10px; font-size:12px; }

.save-strip {
  position:fixed; right:24px; bottom:18px; z-index:40;
  display:flex; align-items:center; gap:8px; padding:8px 11px;
  border-radius:999px; background:var(--navy); color:#dbe5f2; font-size:11px;
  box-shadow:var(--shadow-md); opacity:.88;
}
.save-dot { width:7px;height:7px;border-radius:50%;background:#62c89b; }
.save-strip.saving .save-dot { background:#e0a451; animation:pulse 1s infinite; }
@keyframes pulse { 50% { opacity:.35; } }

main { padding:28px; max-width:1560px; margin:0 auto; }
.page { animation:fadeIn .22s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } }

.hero {
  background:
    radial-gradient(circle at 86% 16%, rgba(73,170,165,.22), transparent 31%),
    linear-gradient(135deg, #0d1728 0%, #14243d 66%, #17353b 120%);
  color:#f2f6fb; border-radius:var(--radius-lg); padding:28px;
  box-shadow:var(--shadow-md); position:relative; overflow:hidden;
}
.hero::after { content:""; position:absolute; width:250px; height:250px; border:1px solid rgba(255,255,255,.07); border-radius:50%; right:-90px; top:-100px; }
.hero-grid { display:grid; grid-template-columns:1.5fr .8fr; gap:24px; align-items:end; }
.hero .eyebrow { color:#75cbc6; }
.hero h2 { font-size:30px; max-width:760px; letter-spacing:-.035em; margin:8px 0; line-height:1.15; }
.hero p { color:#b8c5d6; max-width:780px; margin:0; }
.hero-actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:19px; }
.hero .button:not(.button-primary) { background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.12); }
.hero-aside { border-left:1px solid rgba(255,255,255,.12); padding-left:22px; }
.hero-aside small { color:#91a4bb; text-transform:uppercase; letter-spacing:.08em; }
.hero-aside strong { font-size:38px; display:block; margin:2px 0; }

.grid { display:grid; gap:16px; }
.grid-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
.grid-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
.grid-dashboard { grid-template-columns:1.2fr .8fr; }
.section { margin-top:22px; }
.section-header { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:12px; }
.section-header h2 { margin:0; font-size:18px; letter-spacing:-.02em; }
.section-header p { margin:3px 0 0; color:var(--muted); font-size:12px; }
.section-actions { display:flex; gap:8px; align-items:center; }

.card {
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); padding:18px; min-width:0;
}
.card:hover { border-color:color-mix(in srgb, var(--line-strong) 70%, var(--accent)); }
.card-flat { box-shadow:none; }
.card-accent { background:linear-gradient(145deg,var(--surface),var(--accent-soft)); }
.card-title { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
.card-title h3 { margin:0; font-size:15px; }
.card-title p { margin:3px 0 0; font-size:11px; color:var(--muted); }
.card-actions { display:flex; gap:5px; flex-shrink:0; }
.card-actions button { width:31px;height:31px;border:0;background:var(--surface-2);border-radius:8px;cursor:pointer;color:var(--muted); }
.card-actions button:hover { color:var(--text); background:var(--surface-3); }

.metric { padding:18px; }
.metric-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; }
.metric-value { font-size:29px; font-weight:800; letter-spacing:-.04em; margin:4px 0 2px; }
.metric-foot { color:var(--muted); font-size:11px; }
.metric-icon { float:right; width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent); }

.progress { width:100%; height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.progress > span { height:100%; display:block; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:inherit; }
.progress-row { display:flex; align-items:center; gap:10px; }
.progress-row .progress { flex:1; }
.progress-row strong { font-size:12px; min-width:34px; text-align:right; }

.status { display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap; }
.status::before { content:"";width:6px;height:6px;border-radius:50%;background:currentColor; }
.status-planejado { color:#667085;background:var(--surface-3); }
.status-andamento { color:var(--accent-2);background:var(--accent-soft); }
.status-atencao { color:var(--warning);background:var(--gold-soft); }
.status-concluido { color:var(--success);background:color-mix(in srgb,var(--success) 12%, transparent); }
.status-bloqueado { color:var(--danger);background:color-mix(in srgb,var(--danger) 12%, transparent); }

.list { display:flex; flex-direction:column; gap:9px; }
.list-item {
  display:flex; gap:12px; align-items:flex-start; padding:12px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
}
.list-item-main { flex:1; min-width:0; }
.list-item h4 { margin:0 0 3px; font-size:13px; }
.list-item p { margin:0;color:var(--muted);font-size:11px;white-space:pre-wrap; }
.list-meta { display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:var(--muted);font-size:10px; }
.avatar { width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent-soft),var(--surface-3));font-weight:800;color:var(--accent);flex-shrink:0; }

.empty-state { text-align:center;padding:28px 20px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:14px;background:var(--surface-2); }
.empty-state strong { display:block;color:var(--text);font-size:14px;margin-bottom:4px; }
.empty-state p { margin:0 auto 12px; max-width:480px; font-size:12px; }

.form-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px; }
.form-grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
.field { display:flex;flex-direction:column;gap:6px;min-width:0; }
.field-full { grid-column:1/-1; }
.field label { font-size:11px;font-weight:800;color:var(--muted); }
.field small { color:var(--subtle);font-size:10px; }
.input, .textarea, .select {
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);
  padding:10px 11px;outline:0;transition:.15s ease;font-size:13px;
}
.input:focus,.textarea:focus,.select:focus { border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent);background:var(--surface); }
.textarea { min-height:96px;resize:vertical; }
.textarea-tall { min-height:150px; }
.input[type="range"] { padding:0; }
.form-actions { display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line); }

.inline-edit { border:1px dashed transparent;border-radius:8px;padding:5px 6px;margin:-5px -6px;min-height:1.6em; }
.inline-edit:hover { border-color:var(--line-strong);background:var(--surface-2); }
.inline-edit:focus { outline:0;border-style:solid;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent); }

.table-wrap { overflow:auto;border:1px solid var(--line);border-radius:13px; }
table { border-collapse:collapse;width:100%;min-width:720px;background:var(--surface); }
th,td { text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:11px;vertical-align:top; }
th { background:var(--surface-2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0; }
tr:last-child td { border-bottom:0; }

.tab-bar { display:flex;gap:5px;flex-wrap:wrap;background:var(--surface-2);padding:5px;border:1px solid var(--line);border-radius:13px;margin-bottom:16px; }
.tab-button { border:0;background:transparent;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:11px;font-weight:800;color:var(--muted); }
.tab-button.active { background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm); }

.callout { display:flex;gap:12px;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2); }
.callout-icon { width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;flex-shrink:0; }
.callout strong { display:block;font-size:12px; }
.callout p { margin:3px 0 0;color:var(--muted);font-size:11px; }

.maturity-row { display:grid;grid-template-columns:1.1fr 1.6fr 48px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line); }
.maturity-row:last-child { border-bottom:0; }
.maturity-row h4 { margin:0;font-size:12px; }
.maturity-row p { margin:2px 0 0;color:var(--muted);font-size:10px; }
.score-pill { width:42px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800; }

.timeline { position:relative;padding-left:20px; }
.timeline::before { content:"";position:absolute;left:6px;top:5px;bottom:5px;width:1px;background:var(--line-strong); }
.timeline-item { position:relative;padding:0 0 16px 10px; }
.timeline-item::before { content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent); }
.timeline-item h4 { margin:0;font-size:12px; }
.timeline-item p { margin:3px 0 0;color:var(--muted);font-size:11px; }
.timeline-item time { color:var(--subtle);font-size:9px;text-transform:uppercase;letter-spacing:.08em; }

.kanban { display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow:auto;padding-bottom:8px; }
.kanban-column { background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:180px; }
.kanban-header { display:flex;justify-content:space-between;align-items:center;padding:3px 3px 10px; }
.kanban-header strong { font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted); }
.kanban-count { font-size:10px;background:var(--surface-3);padding:3px 7px;border-radius:999px; }
.kanban-card { background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:pointer; }
.kanban-card h4 { margin:0 0 5px;font-size:12px; }
.kanban-card p { margin:0;color:var(--muted);font-size:10px; }

.file-drop { border:1.5px dashed var(--line-strong);border-radius:15px;padding:26px;text-align:center;background:var(--surface-2);cursor:pointer;transition:.18s ease; }
.file-drop:hover,.file-drop.dragover { border-color:var(--accent);background:var(--accent-soft); }
.file-drop strong { display:block;font-size:13px; }
.file-drop p { margin:4px 0 0;color:var(--muted);font-size:11px; }
.file-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px; }
.file-card { padding:14px; }
.file-type { width:39px;height:45px;border-radius:8px 8px 12px 8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:10px; }
.file-card-row { display:flex;gap:11px;align-items:flex-start; }
.file-card h4 { margin:0;font-size:12px;word-break:break-word; }
.file-card p { margin:3px 0 0;color:var(--muted);font-size:10px; }

.method-card { position:relative;overflow:hidden; }
.method-number { position:absolute;right:13px;top:7px;font-size:54px;font-weight:900;color:var(--surface-3);line-height:1;z-index:0; }
.method-card > *:not(.method-number) { position:relative;z-index:1; }
.method-card h3 { margin:0 0 6px;font-size:15px; }
.method-card p { margin:0;color:var(--muted);font-size:11px; }
.method-card ul { margin:11px 0 0;padding-left:17px;color:var(--muted);font-size:11px; }

.modal-backdrop { position:fixed;inset:0;background:rgba(4,10,20,.55);backdrop-filter:blur(8px);z-index:100;display:grid;place-items:center;padding:20px; }
.modal { width:min(760px,100%);max-height:min(90vh,900px);overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 28px 80px rgba(0,0,0,.3);display:flex;flex-direction:column; }
.modal-wide { width:min(980px,100%); }
.modal-header { display:flex;justify-content:space-between;align-items:flex-start;padding:19px 21px;border-bottom:1px solid var(--line); }
.modal-header h2 { margin:3px 0 0;font-size:20px; }
.modal-body { padding:20px;overflow:auto; }

.toast-region { position:fixed;right:22px;top:95px;z-index:120;display:flex;flex-direction:column;gap:8px; }
.toast { min-width:250px;max-width:360px;background:var(--navy);color:#edf3fa;padding:11px 13px;border-radius:11px;box-shadow:var(--shadow-md);font-size:11px;animation:toastIn .2s ease; }
.toast strong { display:block;font-size:12px;margin-bottom:2px; }
@keyframes toastIn { from { opacity:0;transform:translateX(12px); } }

.search-results { position:fixed;top:70px;right:174px;width:min(520px,calc(100vw - 40px));max-height:65vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-md);z-index:80;padding:8px; }
.search-result { width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;cursor:pointer; }
.search-result:hover { background:var(--surface-2); }
.search-result strong { display:block;font-size:12px; }
.search-result span { display:block;color:var(--muted);font-size:10px;margin-top:2px; }
mark { background:var(--gold-soft);color:var(--text);border-radius:3px;padding:0 2px; }

.quick-capture { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px; }
.quick-capture button { padding:14px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left; }
.quick-capture button:hover { border-color:var(--accent);background:var(--accent-soft); }
.quick-capture strong { display:block;font-size:12px; }
.quick-capture span { color:var(--muted);font-size:10px; }

.note-editor { min-height:220px; padding:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; outline:0; white-space:pre-wrap; }
.note-editor:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent); }

.kbd { border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:9px;background:var(--surface-2); }
.mobile-only { display:none; }

@media (max-width: 1120px) {
  .grid-4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid-3 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .hero-grid,.grid-dashboard { grid-template-columns:1fr; }

  <script>
(function () {
  'use strict';

  const DB_NAME = 'nucleo-central-desenvolvimento';
  const DB_VERSION = 1;
  const STATE_STORE = 'state';
  const FILE_STORE = 'files';
  let dbPromise;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STATE_STORE)) db.createObjectStore(STATE_STORE);
        if (!db.objectStoreNames.contains(FILE_STORE)) {
          const files = db.createObjectStore(FILE_STORE, { keyPath: 'id' });
          files.createIndex('relation', 'relationKey', { unique: false });
          files.createIndex('createdAt', 'createdAt', { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function withStore(storeName, mode, fn) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, mode);
      const store = tx.objectStore(storeName);
      let result;
      try { result = fn(store); } catch (err) { reject(err); return; }
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }

  async function getState() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STATE_STORE, 'readonly');
      const req = tx.objectStore(STATE_STORE).get('app');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveState(state) {
    return withStore(STATE_STORE, 'readwrite', store => store.put(state, 'app'));
  }

  async function addFile(record) {
    return withStore(FILE_STORE, 'readwrite', store => store.put(record));
  }

  async function getFile(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(FILE_STORE, 'readonly');
      const req = tx.objectStore(FILE_STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function getAllFiles() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(FILE_STORE, 'readonly');
      const req = tx.objectStore(FILE_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteFile(id) {
    return withStore(FILE_STORE, 'readwrite', store => store.delete(id));
  }

  async function clearAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction([STATE_STORE, FILE_STORE], 'readwrite');
      tx.objectStore(STATE_STORE).clear();
      tx.objectStore(FILE_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  window.NucleoStorage = { openDB, getState, saveState, addFile, getFile, getAllFiles, deleteFile, clearAll };
})();

  </script>

      <section class="section grid grid-2">
        <div class="card"><div class="card-title"><div><h3>Práticas descartadas como regra</h3><p>Porque parecem gestão, mas frequentemente pioram a decisão.</p></div></div>${checklist(['Avaliação apenas anual', 'PDI reduzido a cursos', 'Ranking forçado de pessoas', 'Muitos KPIs sem leitura de contexto', 'Potencial como opinião subjetiva', 'Delegação por descarte'])}</div>
        <div class="card"><div class="card-title"><div><h3>Critérios de saúde do sistema</h3></div></div>${checklist(['Objetivos são usados para priorizar', 'Ações acontecem no trabalho real', 'Feedback produz acordo e revisão', 'Equipe sabe o que pode decidir', 'Relatórios geram dono e prazo', 'Feitos têm evidência', 'O sistema permanece simples e usado'])}</div>
      </section>

  function renderSettings() {
    return `<div class="page">
      <section class="grid grid-2">
        <div class="card"><div class="card-title"><div><h3>Perfil da central</h3><p>Esses dados aparecem na visão geral e nos relatórios.</p></div></div><div class="form-grid">
          ${fieldInput('Seu nome','meta.userName',state.meta.userName)}
          ${fieldInput('Função','meta.role',state.meta.role)}
          ${fieldInput('Projeto','meta.projectName',state.meta.projectName,true)}
          ${fieldInput('Ano do ciclo','meta.cycleYear',state.meta.cycleYear)}
        </div></div>
        <div class="card card-accent"><div class="card-title"><div><h3>Privacidade e limite técnico</h3><p>GitHub Pages é um site estático.</p></div></div><p class="metric-foot">Textos e arquivos são guardados localmente neste navegador por IndexedDB. Eles não sincronizam automaticamente entre dispositivos, pessoas ou navegadores. Para uso multiusuário, login e sincronização, será necessário conectar um backend, como Supabase ou Firebase.</p><div class="callout" style="margin-top:14px"><div class="callout-icon">!</div><div><strong>Não publique dados confidenciais no repositório</strong><p>O código pode ser público. Avaliações nominais, contratos, credenciais e evidências sensíveis não devem ser incluídos nos arquivos do GitHub.</p></div></div></div>
      </section>

      <section class="section grid grid-3">
        <div class="card"><div class="card-title"><div><h3>Backup completo</h3><p>Inclui textos e arquivos em um JSON portátil.</p></div></div><button class="button button-primary" data-action="export-json">Exportar backup</button><input id="backupFile" type="file" accept="application/json,.json" hidden><button class="button" style="margin-left:6px" data-action="import-json">Importar backup</button></div>
        <div class="card"><div class="card-title"><div><h3>Relatório HTML</h3><p>Gera uma versão estática para arquivar ou imprimir.</p></div></div><button class="button" data-action="export-report">Gerar relatório</button></div>
        <div class="card"><div class="card-title"><div><h3>Armazenamento persistente</h3><p>Solicita ao navegador menor risco de limpeza automática.</p></div></div><button class="button" data-action="persist">Proteger armazenamento</button></div>

  function metricCard(label, value, foot, icon) {
    return `<article class="card metric"><span class="metric-icon">${icon}</span><div class="metric-label">${escapeHTML(label)}</div><div class="metric-value">${escapeHTML(value)}</div><div class="metric-foot">${escapeHTML(foot)}</div></article>`;
  }

  function priorityCard(title, items, page) {
    return `<article class="card"><div class="card-title"><div><h3>${escapeHTML(title)}</h3></div><button class="button button-small" data-action="navigate" data-page="${page}">Editar</button></div><div class="list">${(items || []).slice(0,3).map((x,i)=>simpleListItem(`${i+1}`,x)).join('')}</div></article>`;
  }

  function architectureCard(num,title,question) { return `<article class="card"><span class="status status-andamento">${num}</span><h3 style="margin:11px 0 4px;font-size:15px">${title}</h3><p class="metric-foot">${question}</p></article>`; }
  function annualObjectiveCard(item) {
    const missing = [['indicador',item.indicator],['meta',item.target],['responsável',item.owner],['prazo',item.due],['evidência',item.evidence]].filter(([,value])=>!String(value||'').trim()).map(([label])=>label);
    return `<article class="card">
      <div class="card-title"><div><h3>${escapeHTML(item.title || 'Objetivo sem título')}</h3><p>${escapeHTML(item.owner || 'Sem responsável')} · ${formatDate(item.due)}</p></div><div class="card-actions"><button data-action="edit" data-type="annual-objective" data-id="${item.id}" aria-label="Editar objetivo anual">✎</button><button data-action="delete" data-type="annual-objective" data-id="${item.id}" aria-label="Excluir objetivo anual">×</button></div></div>
      <span class="status status-${item.status || 'planejado'}">${statusLabel(item.status)}</span>
      ${missing.length ? `<span class="status status-atencao" style="margin-left:5px">Falta: ${escapeHTML(missing.join(', '))}</span>` : '<span class="status status-concluido" style="margin-left:5px">Estrutura completa</span>'}

      <div class="list"><div class="list-item"><div class="list-item-main"><h4>Indicador e meta</h4><p>${escapeHTML(item.indicator || 'Indicador não definido')} · ${escapeHTML(item.baseline || 'Sem linha de base')} → ${escapeHTML(item.target || 'Meta não definida')}</p></div></div><div class="list-item"><div class="list-item-main"><h4>Capacidade e sistema</h4><p>${escapeHTML(item.capability || 'Capacidade não definida')} · ${escapeHTML(item.system || 'Sistema de sustentação não definido')}</p></div></div><div class="list-item"><div class="list-item-main"><h4>Evidência</h4><p>${escapeHTML(item.evidence || 'Evidência não definida')}</p></div></div></div>
    </article>`;
  }
  function principleCard(title, text) { return `<article class="card"><h3 style="margin:0 0 6px;font-size:14px">${escapeHTML(title)}</h3><p class="metric-foot">${escapeHTML(text)}</p></article>`; }
  function simpleListItem(title, text) { return `<div class="list-item"><div class="list-item-main"><h4>${escapeHTML(title)}</h4><p>${escapeHTML(text || '')}</p></div></div>`; }
  function checklist(items) { return `<div class="list">${items.map(x=>`<div class="list-item"><span style="color:var(--success);font-weight:900">✓</span><div class="list-item-main"><p style="color:var(--text)">${escapeHTML(x)}</p></div></div>`).join('')}</div>`; }
  function empty(title, text) { return `<div class="empty-state"><strong>${escapeHTML(title)}</strong><p>${escapeHTML(text)}</p></div>`; }
  function fieldInput(label,path,value,full=false) { return `<div class="field ${full?'field-full':''}"><label>${escapeHTML(label)}</label><input class="input" data-bind="${path}" value="${escapeHTML(value ?? '')}"></div>`; }
  function fieldDate(label,path,value) { return `<div class="field"><label>${escapeHTML(label)}</label><input class="input" type="date" data-bind="${path}" value="${escapeHTML(value || '')}"></div>`; }
  function largeTextCard(title,desc,path,value) { return `<div class="card"><div class="card-title"><div><h3>${title}</h3><p>${desc}</p></div></div><textarea class="textarea" data-bind="${path}">${escapeHTML(value || '')}</textarea></div>`; }

  function editableListCard(title, desc, field, items) {
    return `<div class="card"><div class="card-title"><div><h3>${title}</h3><p>${desc}</p></div><button class="button button-small" data-action="add-list-item" data-field="${field}">+</button></div><div class="list">${items.map((item,index)=>`<div class="list-item"><span class="avatar">${index+1}</span><div class="list-item-main"><textarea class="textarea" style="min-height:62px" data-annual-list="${field}" data-index="${index}">${escapeHTML(item)}</textarea></div><button class="icon-button" style="width:32px;height:32px" data-action="remove-list-item" data-field="${field}" data-index="${index}">×</button></div>`).join('')}</div></div>`;
  }

  function pdiMini(item) {
    return `<div class="list-item"><div class="list-item-main"><h4>${escapeHTML(item.title)}</h4><div class="progress-row" style="margin-top:9px"><div class="progress"><span style="width:${clamp(item.progress)}%"></span></div><strong>${clamp(item.progress)}%</strong></div></div><span class="status status-${item.status}">${statusLabel(item.status)}</span></div>`;
  }

  function pdiCard(item) {
    return `<article class="card">
      <div class="card-title"><div><h3>${escapeHTML(item.title)}</h3><p>${escapeHTML(item.competency || 'Competência não definida')}</p></div><div class="card-actions"><button data-action="edit" data-type="pdi" data-id="${item.id}" title="Editar">✎</button><button data-action="delete" data-type="pdi" data-id="${item.id}" title="Excluir">×</button></div></div>

      <p class="metric-foot" style="margin:13px 0">${escapeHTML(item.result || '')}</p>

  function okrCard(item) {
    return `<article class="card"><div class="card-title"><div><h3>${escapeHTML(item.title)}</h3><p>${escapeHTML(item.owner || 'Sem dono')}</p></div><div class="card-actions"><button data-action="edit" data-type="okr" data-id="${item.id}">✎</button><button data-action="delete" data-type="okr" data-id="${item.id}">×</button></div></div><span class="status status-${item.status}">${statusLabel(item.status)}</span><p class="metric-foot" style="margin:12px 0">${escapeHTML(item.objective || '')}</p><div class="progress-row"><div class="progress"><span style="width:${clamp(item.progress)}%"></span></div><strong>${clamp(item.progress)}%</strong></div><div class="list-meta"><span>KR: ${escapeHTML(item.keyResults || 'não definido')}</span></div></article>`;

    decision: { title:'Diário de decisão', path:'leadership.decisions', fields:[f('title','Decisão','text',true),f('date','Data','date'),f('context','Contexto','textarea',true),f('options','Opções consideradas','textarea',true),f('criterion','Critério usado','textarea',true),f('risk','Risco assumido','textarea',true),f('result','Resultado observado','textarea',true),f('learning','Aprendizado','textarea',true)] },
    stakeholder: { title:'Stakeholder', path:'leadership.stakeholders', fields:[f('name','Stakeholder'),f('influence','Poder / influência','select',false,[['alto','Alto'],['medio','Médio'],['baixo','Baixo']]),f('interest','Interesse principal','textarea',true),f('needsFromUs','O que precisa de nós','textarea',true),f('weNeed','O que precisamos dele','textarea',true),f('risk','Risco de desalinhamento','textarea',true),f('strategy','Estratégia de relação','textarea',true)] },
    achievement: { title:'Feito profissional', path:'achievements', fields:[f('title','Título do feito','text',true),f('date','Data','date'),f('category','Categoria','select',false,[['resultado','Resultado'],['capacidade','Capacidade construída'],['risco','Risco reduzido'],['influencia','Influência'],['lideranca','Liderança'],['aprendizado','Aprendizado']]),f('context','Contexto / problema','textarea',true),f('roleVerb','Meu papel','select',false,[['Liderei','Liderei'],['Coordenei','Coordenei'],['Propus','Propus'],['Influenciei','Influenciei'],['Executei','Executei'],['Apoiei','Apoiei'],['Participei','Participei']]),f('action','Ação tomada','textarea',true),f('decision','Decisão ou influência exercida','textarea',true),f('quantitative','Resultado quantitativo','textarea',true),f('qualitative','Resultado qualitativo','textarea',true),f('capability','Capacidade construída','textarea',true),f('evidence','Evidência / fonte','textarea',true),f('learning','Aprendizado','textarea',true)] },
    'review-monthly': reviewConfig('monthly','Revisão mensal'),
    'review-quarterly': reviewConfig('quarterly','Revisão trimestral'),
    'review-semiannual': reviewConfig('semiannual','Revisão semestral'),
    'review-annual': reviewConfig('annual','Fechamento anual')
  };

  function f(name,label,type='text',full=false,options=[]) { return {name,label,type,full,options}; }
  function statusOptions() { return [['planejado','Planejado'],['andamento','Em andamento'],['atencao','Em atenção'],['concluido','Concluído'],['bloqueado','Bloqueado']]; }
  function reviewConfig(kind,title) { return { title, path:`reviews.${kind}`, fields:[f('title','Título do período','text',true),f('date','Data','date'),f('summary','Resumo executivo','textarea',true),f('results','Resultados e evidências','textarea',true),f('capabilities','Capacidades construídas','textarea',true),f('people','Pessoas e autonomia','textarea',true),f('risks','Riscos e bloqueios','textarea',true),f('learning','Aprendizados e erros','textarea',true),f('nextDecision','Decisão para o próximo ciclo','textarea',true)] }; }

  function openEntityModal(type, id = null) {
    const config = entityConfig[type];
    if (!config) return;
    const list = getByPath(state, config.path);
    const existing = id ? list.find(x => x.id === id) : null;
    const record = existing ? { ...existing } : { id: uid(type), createdAt: nowISO(), date: todayISO(), status:'planejado', progress:0, _entityType:type };
    record._entityType = type;
    const fieldsHTML = config.fields.map(field => renderField(field, record[field.name])).join('');
    const attach = ['pdi','achievement','member','review-monthly','review-quarterly','review-semiannual','review-annual'].includes(type)
      ? `<div class="field field-full"><label>Arquivos relacionados</label><input class="input" id="entityFiles" type="file" multiple><small>Os arquivos ficam neste navegador e serão associados ao registro.</small></div>` : '';
    const html = `<form id="entityForm"><div class="form-grid">${fieldsHTML}${attach}</div><div class="form-actions"><button type="button" class="button" id="cancelForm">Cancelar</button><button type="submit" class="button button-primary">${existing?'Salvar alterações':'Criar registro'}</button></div></form>`;
    openModal(existing ? 'Editar registro' : 'Novo registro', config.title, html);
    $('#cancelForm').addEventListener('click', closeModal);
    $('#entityForm').addEventListener('submit', async e => {
      e.preventDefault();
      const form = new FormData(e.currentTarget);
      config.fields.forEach(field => {
        let value = form.get(field.name) ?? '';
        if (field.type === 'number') value = Number(value) || 0;
        record[field.name] = value;
      });
      record.updatedAt = nowISO();
      if (!existing) list.unshift(record); else Object.assign(existing, record);
      const fileInput = $('#entityFiles');
      if (fileInput && fileInput.files.length) await uploadFiles(fileInput.files, { type, id: record.id }, false);
      addActivity(`${existing ? 'Atualizado' : 'Criado'}: ${record.title || record.name || config.title}`, type);
      scheduleSave();
      closeModal();
      renderPage();
      toast('Registro salvo', config.title);
    });
    setTimeout(() => $('#entityForm input, #entityForm textarea, #entityForm select')?.focus(), 30);
  }

  function renderField(field, value) {
    const cls = `field ${field.full ? 'field-full' : ''}`;
    if (field.type === 'textarea') return `<div class="${cls}"><label>${escapeHTML(field.label)}</label><textarea class="textarea" name="${field.name}">${escapeHTML(value || '')}</textarea></div>`;
    if (field.type === 'select') return `<div class="${cls}"><label>${escapeHTML(field.label)}</label><select class="select" name="${field.name}">${field.options.map(([v,l])=>`<option value="${v}" ${String(value)===v?'selected':''}>${escapeHTML(l)}</option>`).join('')}</select></div>`;
    return `<div class="${cls}"><label>${escapeHTML(field.label)}</label><input class="input" type="${field.type}" name="${field.name}" value="${escapeHTML(value ?? '')}" ${field.type==='number'?'min="0" max="100"':''}></div>`;
  }

  function openModal(eyebrow, title, html, wide = false) {
    $('#modalEyebrow').textContent = eyebrow;
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    $('.modal').classList.toggle('modal-wide', wide);
    $('#modalBackdrop').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeModal() { $('#modalBackdrop').hidden = true; document.body.style.overflow = ''; $('#modalBody').innerHTML = ''; }

  function deleteEntity(type, id) {
    const config = entityConfig[type];
    if (!config) return;
    const list = getByPath(state, config.path);
    const item = list.find(x => x.id === id);
    if (!item) return;
    if (!confirm(`Excluir “${item.title || item.name || config.title}”? Esta ação não pode ser desfeita.`)) return;
    const index = list.findIndex(x => x.id === id);
    list.splice(index,1);
    addActivity(`Excluído: ${item.title || item.name || config.title}`, 'delete');
    scheduleSave(); renderPage();
  }

  function entityTypeFor(item) { return item._entityType || inferType(item); }
  function inferType(item) {
    const groups = [
      ['oneOnOne',state.leadership.oneOnOnes],['feedback',state.leadership.feedbacks],['delegation',state.leadership.delegations],['decision',state.leadership.decisions],['stakeholder',state.leadership.stakeholders],
      ['review-monthly',state.reviews.monthly],['review-quarterly',state.reviews.quarterly],['review-semiannual',state.reviews.semiannual],['review-annual',state.reviews.annual]
    ];
    return (groups.find(([,arr])=>arr.some(x=>x.id===item.id)) || [''])[0];
  }

  function addAnnualListItem(field) { state.annual[field].push(''); scheduleSave(); renderPage(); }
  function removeAnnualListItem(field,index) { if (state.annual[field].length <= 1) return toast('Mantenha ao menos um campo', 'Você pode deixá-lo em branco.'); state.annual[field].splice(index,1); scheduleSave(); renderPage(); }

  function openAchievementText(id) {
    const item = state.achievements.find(x => x.id === id); if (!item) return;
    const texts = achievementVersions(item);
    openModal('Versões do registro', item.title, `<div class="grid">${Object.entries(texts).map(([label,text])=>`<div class="card"><div class="card-title"><div><h3>${label}</h3></div><button class="button button-small" data-copy-button>Copiar</button></div><textarea class="textarea textarea-tall" readonly>${escapeHTML(text)}</textarea></div>`).join('')}</div>`, true);
    $$('[data-copy-button]', $('#modalBody')).forEach((btn,index)=>btn.addEventListener('click',()=>copyText(Object.values(texts)[index])));
  }

  function achievementVersions(a) {
    const result = [a.quantitative,a.qualitative].filter(Boolean).join(' ');
    const context = a.context || 'Em um contexto operacional relevante';
    const action = `${a.roleVerb || 'Atuei'} ${lowerFirst(a.action || 'na condução da entrega')}`;
    return {
      'Avaliação interna': `${context}. Meu papel foi: ${a.roleVerb || 'atuação direta'}. ${a.action || ''} ${a.decision ? `Decisão/influência: ${a.decision}.` : ''} Resultado: ${result || 'a mensurar'}. ${a.capability ? `Capacidade construída: ${a.capability}.` : ''} ${a.evidence ? `Evidência: ${a.evidence}.` : ''}`.replace(/\s+/g,' ').trim(),
      'Currículo': `${action}${result ? `, gerando ${lowerFirst(result)}` : ''}${a.capability ? ` e consolidando ${lowerFirst(a.capability)}` : ''}.`.replace(/\s+/g,' ').trim(),
      'LinkedIn': `${context}. ${action}. O trabalho resultou em ${lowerFirst(result || 'uma melhoria relevante ainda em consolidação')}. ${a.learning ? `Principal aprendizado: ${a.learning}.` : ''}`.replace(/\s+/g,' ').trim(),
      'Entrevista STAR': `Situação: ${context}\nTarefa: ${a.decision || a.title}\nAção: ${a.roleVerb || 'Atuei'} — ${a.action || ''}\nResultado: ${result || 'a mensurar'}\nReflexão: ${a.learning || 'registrar aprendizado e o que faria diferente'}`
    };
  }

  async function uploadFiles(fileList, relation = {type:'library',id:'general'}, rerender = true) {
    const files = Array.from(fileList);
    for (const file of files) {
      if (file.size > 25 * 1024 * 1024) { toast('Arquivo muito grande', `${file.name} excede 25 MB.`); continue; }
      const record = { id:uid('file'), name:file.name, type:file.type, size:file.size, blob:file, relationKey:`${relation.type}:${relation.id}`, relationType:relation.type, relationId:relation.id, createdAt:nowISO() };
      try { await Storage.addFile(record); fileCache.unshift(record); }
      catch (error) { console.error(error); toast('Falha ao salvar arquivo', file.name); }
    }
    addActivity(`${files.length} arquivo(s) adicionado(s)`, 'file');
    scheduleSave();
    if (rerender) renderPage();
    toast('Arquivos adicionados', `${files.length} item(ns) processado(s).`);
  }

  function setupDropZone() {
    const drop = $('#fileDrop'); if (!drop) return;
    ['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('dragover');}));
    ['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('dragover');}));
    drop.addEventListener('drop',e=>uploadFiles(e.dataTransfer.files,{type:'library',id:'general'}));
  }

  async function downloadFile(id) {
    const record = await Storage.getFile(id); if (!record) return;
    const url = URL.createObjectURL(record.blob);
    const a = document.createElement('a'); a.href=url; a.download=record.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  async function removeFile(id) {
    const file = fileCache.find(x=>x.id===id); if (!file) return;
    if (!confirm(`Excluir o arquivo “${file.name}”?`)) return;
    await Storage.deleteFile(id); fileCache = fileCache.filter(x=>x.id!==id); renderPage();
  }

  async function exportBackup() {
    toast('Preparando backup', 'Arquivos grandes podem levar alguns segundos.');
    const files = await Storage.getAllFiles();
    const encoded = [];
    for (const file of files) encoded.push({ ...omit(file,'blob'), data: await blobToDataURL(file.blob) });
    const payload = { format:'nucleo-backup', version:1, exportedAt:nowISO(), state, files:encoded };
    downloadBlob(new Blob([JSON.stringify(payload)],{type:'application/json'}),`nucleo-backup-${todayISO()}.json`);
  }

  async function importBackup(file) {
    try {
      const payload = JSON.parse(await file.text());
      if (payload.format !== 'nucleo-backup' || !payload.state) throw new Error('Formato inválido');
      if (!confirm('Importar este backup substituirá os dados atuais deste navegador. Continuar?')) return;
      await Storage.clearAll();
      state = migrateState(payload.state);
      for (const item of payload.files || []) {
        const blob = dataURLToBlob(item.data);
        await Storage.addFile({ ...omit(item,'data'), blob });
      }
      await Storage.saveState(state);
      fileCache = await Storage.getAllFiles();
      applyTheme(state.meta.theme);
      renderPage();
      toast('Backup importado', 'Textos e arquivos foram restaurados.');
    } catch (error) { console.error(error); toast('Backup inválido', 'O arquivo não pôde ser importado.'); }
  }

  function exportReport() {
    const html = buildReportHTML();
    downloadBlob(new Blob([html],{type:'text/html'}),`relatorio-desenvolvimento-${todayISO()}.html`);
  }

  function buildReportHTML() {
    const goals = state.pdi.map(x=>`<article><h3>${escapeHTML(x.title)}</h3><p><b>Competência:</b> ${escapeHTML(x.competency)}</p><p><b>Resultado:</b> ${escapeHTML(x.result)}</p><p><b>Evidência:</b> ${escapeHTML(x.evidence)}</p><p><b>Progresso:</b> ${clamp(x.progress)}%</p></article>`).join('');
    const feats = state.achievements.map(x=>`<article><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(achievementVersions(x)['Avaliação interna'])}</p></article>`).join('');
    return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de Desenvolvimento</title><style>body{font-family:Arial,sans-serif;max-width:980px;margin:40px auto;padding:0 24px;color:#182033;line-height:1.5}h1{font-size:32px}h2{border-bottom:2px solid #1d7a78;padding-bottom:7px;margin-top:34px}article{border:1px solid #dfe4ea;border-radius:12px;padding:16px;margin:12px 0}small{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:#f4f7f8;padding:14px;border-radius:10px}@media print{body{margin:0}.no-print{display:none}}</style></head><body><small>Gerado em ${formatDateTime(nowISO())}</small><h1>${escapeHTML(state.meta.userName)} — Central de Desenvolvimento</h1><p><b>Função:</b> ${escapeHTML(state.meta.role)}<br><b>Projeto:</b> ${escapeHTML(state.meta.projectName)}</p><h2>Direção anual</h2><p>${escapeHTML(state.annual.north)}</p><div class="grid"><div class="box"><b>Resultados</b><ul>${state.annual.results.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div><div class="box"><b>Competências</b><ul>${state.annual.competencies.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div><div class="box"><b>Equipe</b><ul>${state.annual.teamPriorities.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></div></div><h2>PDI</h2>${goals || '<p>Sem registros.</p>'}<h2>Feitos profissionais</h2>${feats || '<p>Sem registros.</p>'}<h2>Leitura de maturidade</h2><ul>${Object.entries(state.project.maturity).map(([k,v])=>`<li>${escapeHTML(k)}: ${v}/5</li>`).join('')}</ul><p class="no-print"><button onclick="window.print()">Imprimir / salvar em PDF</button></p></body></html>`;
  }

  async function requestPersistentStorage() {
    if (!navigator.storage?.persist) return toast('Recurso indisponível', 'Seu navegador não oferece essa opção.');
    const granted = await navigator.storage.persist();
    toast(granted ? 'Armazenamento protegido' : 'Solicitação não concedida', granted ? 'O navegador marcou os dados como persistentes.' : 'Mantenha backups periódicos.');
  }

  async function resetApp() {
    if (!confirm('Apagar todos os textos, registros e arquivos deste navegador?')) return;
    if (!confirm('Confirmação final: esta ação não pode ser desfeita sem um backup.')) return;
    await Storage.clearAll(); state=defaultState(); await Storage.saveState(state); fileCache=[]; applyTheme('light'); navigate('dashboard'); toast('Central reiniciada','Todos os dados locais foram apagados.');
  }

  function handleSearch(event) {
    const query = event.target.value.trim().toLowerCase();
    if (searchBox) searchBox.remove();
    if (query.length < 2) return;
    const results = searchIndex().filter(x=>x.text.toLowerCase().includes(query)).slice(0,12);
    searchBox = document.createElement('div'); searchBox.className='search-results';
    searchBox.innerHTML = results.length ? results.map(r=>`<button class="search-result" data-page-target="${r.page}"><strong>${highlight(r.title,query)}</strong><span>${highlight(r.text.slice(0,150),query)}</span></button>`).join('') : '<div class="empty-state"><strong>Nenhum resultado</strong><p>Tente um termo mais específico.</p></div>';
    document.body.appendChild(searchBox);
    searchBox.addEventListener('click',e=>{const btn=e.target.closest('[data-page-target]');if(!btn)return;navigate(btn.dataset.pageTarget);searchBox.remove();searchBox=null;$('#globalSearch').value='';});
  }

  function searchIndex() {
    const out=[]; const push=(page,title,obj)=>out.push({page,title,text:flattenText(obj)});
    push('annual','Direção anual',state.annual);
    state.pdi.forEach(x=>push('pdi',x.title,x));
    state.project.okrs.forEach(x=>push('project',x.title,x));
    state.project.improvements.forEach(x=>push('project',x.title,x));
    state.project.risks.forEach(x=>push('project',x.title,x));
    state.team.members.forEach(x=>push('team',x.name,x));
    Object.values(state.leadership).flat().forEach(x=>push('leadership',x.title||x.person||x.name||'Registro de liderança',x));
    state.achievements.forEach(x=>push('achievements',x.title,x));
    Object.values(state.reviews).flat().forEach(x=>push('reviews',x.title||'Revisão',x));
    fileCache.forEach(x=>push('library',x.name,x.name));
    return out;
  }

  function handleShortcuts(e) {
    if (e.key === 'Escape') { if (!$('#modalBackdrop').hidden) closeModal(); if (searchBox) { searchBox.remove(); searchBox=null; } }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#globalSearch').focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); openQuickCapture(); }
  }

  function getNextReview() {
    const dates = [
      {date:state.annual.nextMonthlyReview,label:'revisão mensal'},
      {date:state.annual.nextQuarterlyReview,label:'revisão trimestral'}
    ].filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));
    if (!dates.length) return {value:'—',label:'defina a próxima data'};
    return {value:formatDate(dates[0].date,{day:'2-digit',month:'short'}),label:dates[0].label};
  }

  function statusLabel(status) { return ({planejado:'Planejado',andamento:'Em andamento',atencao:'Em atenção',concluido:'Concluído',bloqueado:'Bloqueado'})[status] || status || 'Planejado'; }
  function avg(values) { const nums=values.map(Number).filter(Number.isFinite); return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : 0; }
  function countBy(arr,key) { return arr.reduce((acc,x)=>(acc[x[key]||'outros']=(acc[x[key]||'outros']||0)+1,acc),{}); }
  function initials(name='') { return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || '?'; }
  function lowerFirst(text='') { return text ? text[0].toLowerCase()+text.slice(1) : ''; }
  function formatDate(date, options={day:'2-digit',month:'2-digit',year:'numeric'}) { if(!date)return 'Sem prazo'; const d=new Date(`${date}T12:00:00`); return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('pt-BR',options).format(d); }
  function formatDateTime(date) { if(!date)return '—'; const d=new Date(date); return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d); }
  function formatBytes(bytes=0) { const units=['B','KB','MB','GB']; let i=0,n=bytes; while(n>=1024&&i<units.length-1){n/=1024;i++;} return `${n.toFixed(i?1:0)} ${units[i]}`; }
  function debounce(fn,wait){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),wait);};}
  function setByPath(obj,path,value){const parts=path.split('.');const last=parts.pop();const target=parts.reduce((a,k)=>a[k],obj);target[last]=value;}
  function getByPath(obj,path){return path.split('.').reduce((a,k)=>a[k],obj);}
  function omit(obj,...keys){return Object.fromEntries(Object.entries(obj).filter(([k])=>!keys.includes(k)));}
  function flattenText(obj){if(obj==null)return'';if(typeof obj==='string'||typeof obj==='number')return String(obj);if(Array.isArray(obj))return obj.map(flattenText).join(' ');if(typeof obj==='object')return Object.entries(obj).filter(([k])=>!['blob','id'].includes(k)).map(([,v])=>flattenText(v)).join(' ');return'';}
  function highlight(text,query){const safe=escapeHTML(text);const q=escapeHTML(query).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return safe.replace(new RegExp(`(${q})`,'ig'),'<mark>$1</mark>');}
  function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast('Copiado','Texto enviado para a área de transferência.')).catch(()=>toast('Não foi possível copiar','Selecione e copie manualmente.'));}
  function toast(title,message=''){const el=document.createElement('div');el.className='toast';el.innerHTML=`<strong>${escapeHTML(title)}</strong>${escapeHTML(message)}`;$('#toastRegion').appendChild(el);setTimeout(()=>el.remove(),3600);}
  function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});}
  function dataURLToBlob(dataURL){const [head,data]=dataURL.split(',');const mime=(head.match(/data:(.*?);/)||[])[1]||'application/octet-stream';const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
  function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function renderFatal(error){$('#mainContent').innerHTML=`<div class="empty-state"><strong>Não foi possível iniciar a central</strong><p>${escapeHTML(error.message||String(error))}</p></div>`;}

  init();
})();

  </script>
</body>
